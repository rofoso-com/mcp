name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server.json'
      - 'package.json'
      - '.github/workflows/publish-mcp.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # REQUIRED for GitHub OIDC authentication
      contents: read   # Required to check out code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          mkdir -p /tmp/mcp-publisher-bin
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar -xz -C /tmp/mcp-publisher-bin
          chmod +x /tmp/mcp-publisher-bin/mcp-publisher
          echo "/tmp/mcp-publisher-bin" >> $GITHUB_PATH

      - name: Authenticate to MCP Registry via OIDC
        run: mcp-publisher login github-oidc

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Publish server to MCP Registry
        run: mcp-publisher publish
